name: dependabot-lockfile
# dependabot が package.json だけを更新して pnpm-lock.yaml を追従させない PR を自動修復する。
# dependabot 起動の pull_request workflow は token が read-only になるため、pull_request_target で動かす。
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  regen-lockfile:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.6
      # PR の manifest 由来の lifecycle script は実行しない
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - name: pnpm-lock.yaml が変わったときだけ push する
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already in sync'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build(deps): regenerate pnpm-lock.yaml for dependency bump'
          git push origin "HEAD:refs/heads/$HEAD_REF"
